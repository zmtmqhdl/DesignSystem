name: Design System CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 실행 권한 부여 (working-directory 추가)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      # 디버그 APK 빌드 (working-directory 추가)
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: ./android

      # Firebase App Distribution 업로드
      - name: Upload to Firebase App Distribution
        uses: w9jds/firebase-action@v11.16.0
        with:
          args: appdistribution:distribute android/app/build/outputs/apk/debug/app-debug.apk --app ${{ secrets.FIREBASE_APP_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
