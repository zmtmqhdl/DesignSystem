name: Design System CD

on:
  push:
    branches: [ "main" ]

jobs:
  CD_DEV:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Build DEV Debug APK
        run: ./gradlew assembleDevDebug
        working-directory: ./android

      - name: Upload DEV to Firebase
        uses: w9jds/firebase-action@v11.16.0
        with:
          args: appdistribution:distribute android/app/build/outputs/apk/dev/debug/app-dev-debug.apk --app ${{ secrets.FIREBASE_DISTRIBUTION_DEV }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  CD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Build PROD Debug APK
        run: ./gradlew assembleProdDebug
        working-directory: ./android

      - name: Upload PROD to Firebase
        uses: w9jds/firebase-action@v11.16.0
        with:
          args: appdistribution:distribute android/app/build/outputs/apk/prod/debug/app-prod-debug.apk --app ${{ secrets.FIREBASE_DISTRIBUTION_PROD }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
